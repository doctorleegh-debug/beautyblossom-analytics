<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>뷰티블라썸 통합 성과 보고서</title>
<style>
  :root{
    --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,0.10);
    --good:#006300; --bad:#d03b3b; --warn:#fab219;
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300;
  }
  :root[data-theme="dark"]{
    --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,0.10);
    --good:#0ca30c; --bad:#d03b3b; --warn:#fab219;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300;
  }
  @media (prefers-color-scheme: dark){
    :root:where(:not([data-theme="light"])){
      --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,0.10);
      --good:#0ca30c;
      --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);
       font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.55}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 20px 80px}
  header{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin-bottom:6px}
  h1{font-size:26px;margin:0;letter-spacing:-.01em}
  h2{font-size:18px;margin:38px 0 4px;letter-spacing:-.01em}
  h3{font-size:14px;margin:0 0 10px;color:var(--ink2);font-weight:600}
  .sub{color:var(--ink2);font-size:13px;margin:2px 0 0}
  .card{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:18px}
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  @media(max-width:860px){.g2{grid-template-columns:1fr}}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-top:14px}
  .tile{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:14px 16px}
  .tile .k{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px}
  .tile .v{font-size:26px;font-weight:650;margin-top:4px;letter-spacing:-.02em}
  .tile .d{font-size:12px;margin-top:2px;color:var(--ink2)}
  .up{color:var(--good);font-weight:600} .dn{color:var(--bad);font-weight:600}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
  .legend{display:flex;flex-wrap:wrap;gap:14px;margin:0 0 10px;font-size:12px;color:var(--ink2)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:right;padding:8px 10px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums}
  th:first-child,td:first-child{text-align:left;font-variant-numeric:normal}
  th{color:var(--ink2);font-weight:600;font-size:12px}
  tbody tr:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}
  .note{font-size:12px;color:var(--ink2);margin-top:10px}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--ring);color:var(--ink2)}
  .pill.ok{color:var(--good)} .pill.pend{color:var(--warn)}
  button.theme{background:var(--surface);border:1px solid var(--ring);color:var(--ink2);
     border-radius:8px;padding:7px 12px;cursor:pointer;font-size:12px;font-family:inherit}
  svg{display:block;width:100%;height:auto;overflow:visible}
  .tt{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--ring);
      border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 6px 24px rgba(0,0,0,.13);
      opacity:0;transition:opacity .1s;z-index:50;max-width:280px}
  .tt b{font-weight:650}
  .tt .r{display:flex;justify-content:space-between;gap:14px;align-items:center}
  .src{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  a{color:inherit}
</style>
</head>

<div class="wrap">
  <header>
    <div>
      <h1>뷰티블라썸 통합 성과 보고서</h1>
      <p class="sub" id="rangeLine"></p>
    </div>

  <div class="src" id="srcPills"></div>

  <h2>전체 요약</h2>
  <div class="tiles" id="heroTiles"></div>

  <h2>GA4 · 웹사이트</h2>
  <div class="grid g2" style="margin-top:14px">
    <div class="card">
      <h3>속성별 활성 사용자 (30일)</h3>
      <div id="ga4Bars"></div>
    </div>
    <div class="card">
      <h3>일별 활성 사용자</h3>
      <div class="legend" id="ga4Legend"></div>
      <div id="ga4Lines"></div>

  </div>

  <h2>YouTube</h2>
  <div class="tiles" id="ytTiles"></div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><h3>일별 조회수</h3><div id="ytLine"></div></div>
    <div class="card"><h3>트래픽 소스 (조회수)</h3><div id="ytTraffic"></div></div>
  </div>
  <div class="card" style="margin-top:14px">
    <h3>상위 영상</h3>
    <div style="overflow-x:auto"><table id="ytTable"></table></div>
  </div>

  <h2>검색 유입 · 구글 vs 네이버</h2>
  <div class="card" style="margin-top:14px">
    <h3>검색엔진별 클릭 · 노출</h3>
    <div class="legend" id="seLegend"></div>
    <div id="seCompare"></div>
    <p class="note" id="seNote"></p>
  </div>

  <h2>Google Search Console</h2>
  <div id="gscBody"></div>

  <h2>네이버 서치어드바이저</h2>
  <div id="naverBody"></div>

  <h2>Instagram · Threads</h2>
  <div id="igBody"></div>

  <h2>데이터 수집 상태</h2>
  <div class="card" style="margin-top:14px">
    <div style="overflow-x:auto"><table id="statusTable"></table></div>
  </div>
</div>

<script>

function showTip(ev, html){

  tt.style.left = x + 'px'; tt.style.top = y + 'px';

document.getElementById('themeBtn').onclick = () => {

};

const SVGNS = 'http://www.w3.org/2000/svg';
function el(n, a, kids){
  const e = document.createElementNS(SVGNS, n);
  for (const k in (a||{})) e.setAttribute(k, a[k]);
  for (const c of [].concat(kids||[])) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  return e;
}

function hbars(mount, rows, opt){
  opt = opt || {};
  const W = 560, rowH = 34, padL = opt.padL || 128, padR = 92, top = 6;
  const H = top + rows.length * rowH + 6;
  const max = Math.max.apply(null, rows.map(r => r.value).concat([1]));
  const svg = el('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img' });
  rows.forEach((r, i) => {

function stacked(mount, groups, keys, colors){

  const W = 560, H = 230, padL = 46, padR = 34, padT = 10, padB = 24;
  const n = Math.max.apply(null, series.map(s => s.points.length));
  const max = Math.max.apply(null, [1].concat(series.reduce((a, s) => a.concat(s.points.map(p => p.y)), [])));
  const X = i => padL + (n <= 1 ? 0 : i * (W - padL - padR) / (n - 1));
  const Y = v => padT + (1 - v / max) * (H - padT - padB);
  const svg = el('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img' });
  for (let t = 0; t <= 4; t++) {
    const v = max * t / 4, y = Y(v);
    svg.appendChild(el('line', { x1: padL, x2: W - padR, y1: y, y2: y, stroke: cssv('--grid'), 'stroke-width': 1 }));
    svg.appendChild(el('text', { x: padL - 8, y: y + 4, 'text-anchor': 'end', 'font-size': 10, fill: cssv('--muted') },
      v >= 1000 ? (v / 1000).toFixed(v >= 10000 ? 0 : 1) + 'k' : String(Math.round(v))));
  }
  series.forEach(s => {
    const d = s.points.map((p, i) => (i ? 'L' : 'M') + X(i) + ' ' + Y(p.y)).join(' ');
    svg.appendChild(el('path', { d: d, fill: 'none', stroke: s.color, 'stroke-width': 2,
      'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
    const last = s.points[s.points.length - 1];
    if (last && opt.labelEnds !== false)
      svg.appendChild(el('text', { x: X(s.points.length - 1) + 5, y: Y(last.y) + 3, 'font-size': 10,
        fill: s.color, 'font-weight': 600 }, s.name));
  });
  const first = (series[0] || {}).points || [];
  if (first.length) {
    [0, Math.floor(n / 2), n - 1].forEach(i => {
      const p = first[i]; if (!p) return;
      svg.appendChild(el('text', { x: X(i), y: H - 6,
        'text-anchor': i === 0 ? 'start' : (i === n - 1 ? 'end' : 'middle'),
        'font-size': 10, fill: cssv('--muted') }, p.x.slice(4, 6) + '/' + p.x.slice(6, 8)));
    });
  }
  const cross = el('line', { x1: 0, x2: 0, y1: padT, y2: H - padB, stroke: cssv('--axis'), 'stroke-width': 1, opacity: 0 });
  svg.appendChild(cross);
  const hit = el('rect', { x: padL, y: padT, width: W - padL - padR, height: H - padT - padB, fill: 'transparent' });
  hit.addEventListener('mousemove', ev => {
    const r = svg.getBoundingClientRect();
    const rel = (ev.clientX - r.left) / r.width * W;
    let i = Math.round((rel - padL) / ((W - padL - padR) / Math.max(1, n - 1)));
    i = Math.max(0, Math.min(n - 1, i));
    cross.setAttribute('x1', X(i)); cross.setAttribute('x2', X(i)); cross.setAttribute('opacity', 1);
    const date = (series[0].points[i] || {}).x || '';
    const body = series.map(s => '<div class="r"><span><span class="dot" style="background:' + s.color + '"></span> ' +
      esc(s.name) + '</span><span>' + nf((s.points[i] || {}).y) + '</span></div>').join('');
    showTip(ev, '<b>' + date.slice(0, 4) + '-' + date.slice(4, 6) + '-' + date.slice(6, 8) + '</b>' + body);
  });
  hit.addEventListener('mouseleave', () => { cross.setAttribute('opacity', 0); hideTip(); });
  svg.appendChild(hit);
  mount.innerHTML = ''; mount.appendChild(svg);
}

// Month-over-month change: polarity, so a diverging bar around a zero baseline.
// Direction is carried by the glyph and the number too, never by colour alone.
function diverging(mount, rows){
  const W = 900, rowH = 30, padL = 116, padR = 92, top = 8;
  const H = top + rows.length * rowH + 10;
  const mid = padL + (W - padL - padR) / 2;
  const max = Math.max.apply(null, rows.map(r => Math.abs(r.value)).concat([1]));
  const half = (W - padL - padR) / 2 - 6;
  const svg = el('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img' });
  svg.appendChild(el('line', { x1: mid, x2: mid, y1: top - 4, y2: H - 8, stroke: cssv('--axis'), 'stroke-width': 1 }));
  rows.forEach((r, i) => {
    const y = top + i * rowH, bh = 15;
    const up = r.value >= 0;
    const w = Math.max(2, Math.abs(r.value) / max * half);
    svg.appendChild(el('text', { x: padL - 12, y: y + bh - 3, 'text-anchor': 'end',
      'font-size': 12, fill: cssv('--ink2') }, r.label));
    const bar = el('rect', { x: up ? mid + 1 : mid - w - 1, y: y, width: w, height: bh, rx: 4,
      fill: up ? cssv('--good') : cssv('--bad') });
    bar.addEventListener('mousemove', e => showTip(e,
      '<b>' + esc(r.label) + '</b><div class="r"><span>전월 대비</span><span>' +
      (up ? '▲ +' : '▼ ') + nf1(r.value) + '%</span></div>'));
    bar.addEventListener('mouseleave', hideTip);
    svg.appendChild(bar);
    svg.appendChild(el('text', { x: up ? mid + w + 8 : mid - w - 8, y: y + bh - 3,
      'text-anchor': up ? 'start' : 'end', 'font-size': 11, 'font-weight': 600,
      fill: up ? cssv('--good') : cssv('--bad') }, (up ? '▲ +' : '▼ ') + nf1(r.value) + '%'));
  });
  mount.innerHTML = ''; mount.appendChild(svg);
}

function tile(k, v, d, colorVar){
  const dot = colorVar ? '<span class="dot" style="background:' + cssv(colorVar) + '"></span>' : '';
  return '<div class="tile"><div class="k">' + dot + esc(k) + '</div><div class="v">' + v +
         '</div><div class="d">' + (d || '') + '</div></div>';
}

        '<span><span class="dot" style="background:' + cssv('--bad') + '"></span>▼ 하락</span></div>' +
        '<div id="nvDelta"></div>' +
        '<p class="note">네이버 콘솔이 표시하는 전월 대비 증감률입니다. 막대 길이는 변화폭, 기호와 숫자가 방향을 함께 나타냅니다.</p></div>' +
      '<div class="card" style="margin-top:14px"><h3>사이트별 검색 성과 (최근 30일)</h3>' +
        '<div style="overflow-x:auto"><table id="nvTable"></table></div>' +
        '<p class="note">' + esc(nv.note) + '</p></div>' +
      '<div class="card" style="margin-top:14px">' +
        '<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px">' +
          '<h3 style="margin:0">노출 키워드 · 웹문서</h3>' +
          '<div id="nvSiteTabs" class="legend" style="margin:0"></div>' +
        '</div>' +
        '<div class="grid g2"><div><h3>검색 키워드 TOP</h3><div style="overflow-x:auto"><table id="nvKw"></table></div></div>' +
        '<div><h3>검색 웹문서 TOP</h3><div style="overflow-x:auto"><table id="nvDoc"></table></div></div></div>' +
        '<p class="note">네이버 콘솔은 한 페이지에 10행씩 표시하며, 여기에는 각 사이트의 상위 10개가 담겨 있습니다.</p></div>';

    let sumC = 0, sumI = 0;
    okSites.forEach(x => { sumC += (x.clicks || 0); sumI += (x.impressions || 0); });
    document.getElementById('nvTiles').innerHTML =
      tile('총 클릭 (근사)', nf(sumC), okSites.length + '개 사이트 합계') +
      tile('총 노출 (근사)', nf(sumI), okSites.length + '개 사이트 합계') +
      tile('전체 CTR (근사)', sumI ? nf1(sumC / sumI * 100) + '%' : '—', '클릭 ÷ 노출');

    const pnum = s => { const m = String(s == null ? '' : s).match(/-?[\d.]+/); return m ? parseFloat(m[0]) * (String(s).indexOf('-') === 0 ? -1 : 1) : null; };
    const deltaRows = [];
    okSites.forEach(s => {
      [['클릭', s.clicks_delta], ['노출', s.impressions_delta]].forEach(pair => {
        const v = pnum(pair[1]);
        if (v == null) return;
        deltaRows.push({ label: s.label + ' · ' + pair[0], value: v });
      });
    });
    diverging(document.getElementById('nvDelta'), deltaRows);

    document.getElementById('nvTable').innerHTML =
      '<thead><tr><th>사이트</th><th>클릭</th><th>전월 대비</th><th>노출</th><th>전월 대비</th><th>평균 CTR</th><th>전월 대비</th></tr></thead><tbody>' +
      okSites.map(s => {
        const cell = d => { const v = pnum(d); if (v == null || v === 0) return '<td>—</td>';
          return '<td class="' + (v > 0 ? 'up' : 'dn') + '">' + (v > 0 ? '▲' : '▼') + ' ' + nf1(Math.abs(v)) + '%</td>'; };
        return '<tr><td>' + esc(s.label) + ' · ' + esc(String(s.url).replace('https://', '')) + '</td>' +
          '<td>' + esc(s.clicks_raw || '—') + '</td>' + cell(s.clicks_delta) +
          '<td>' + esc(s.impressions_raw || '—') + '</td>' + cell(s.impressions_delta) +
          '<td>' + esc(s.ctr_raw || '—') + '</td>' + cell(s.ctr_delta) + '</tr>';
      }).join('') + '</tbody>';

    const withKw = okSites.filter(s => (s.keywords && s.keywords.length) || (s.documents && s.documents.length));
    let activeSite = (withKw[0] || okSites[0]).label;
    function drawTabs() {
      document.getElementById('nvSiteTabs').innerHTML = withKw.map(s =>
        '<span><button type="button" class="theme" data-site="' + esc(s.label) + '" style="' +
        (s.label === activeSite ? 'border-color:' + cssv('--s1') + ';color:' + cssv('--ink') + ';font-weight:600' : '') +
        '">' + esc(s.label) + '</button></span>').join('');
      Array.prototype.forEach.call(document.querySelectorAll('#nvSiteTabs button'), b => {
        b.onclick = () => { activeSite = b.getAttribute('data-site'); drawTabs(); drawKw(); };
      });
    }
    function drawKw() {
      const s = withKw.filter(x => x.label === activeSite)[0] || { keywords: [], documents: [] };
      const kw = s.keywords || [], dc = s.documents || [];
      document.getElementById('nvKw').innerHTML = kw.length
        ? '<thead><tr><th>#</th><th>키워드</th><th>클릭</th><th>노출</th><th>CTR</th></tr></thead><tbody>' +
          kw.map(k => '<tr><td>' + k.rank + '</td><td>' + esc(k.label) + '</td><td>' + nf(k.clicks) +
            '</td><td>' + nf(k.impressions) + '</td><td>' + nf1(k.ctr) + '%</td></tr>').join('') + '</tbody>'
        : '<tbody><tr><td>수집된 키워드가 없습니다.</td></tr></tbody>';
      document.getElementById('nvDoc').innerHTML = dc.length
        ? '<thead><tr><th>#</th><th>웹문서</th><th>클릭</th><th>노출</th><th>CTR</th></tr></thead><tbody>' +
          dc.map(k => '<tr><td>' + k.rank + '</td><td><a href="' + esc(k.label) + '" target="_blank" rel="noopener">' +
            esc(String(k.label).replace(/^https?:\/\//, '')) + '</a></td><td>' + nf(k.clicks) +
            '</td><td>' + nf(k.impressions) + '</td><td>' + nf1(k.ctr) + '%</td></tr>').join('') + '</tbody>'
        : '<tbody><tr><td>수집된 웹문서가 없습니다.</td></tr></tbody>';
    }
    drawTabs(); drawKw();
  } else {
    nb.innerHTML = '<div class="card" style="margin-top:14px"><p class="sub">' + esc(D.meta.naver.reason) + '</p>' +
      '<p class="note">네이버는 성과 조회용 공개 API가 없어 로그인된 콘솔 화면에서만 수집됩니다.</p></div>';
  }

  const iga = ((D.igApi && D.igApi.accounts) || []).filter(a => a.status === 'OK' && a.ig);
  const igb = document.getElementById('igBody');
  if (iga.length) {
    const totF = iga.reduce((s, a) => s + a.ig.followers, 0);
    const totM = iga.reduce((s, a) => s + a.ig.media_count, 0);
    const totE = iga.reduce((s, a) => s + ((a.recent && a.recent.engagement) || 0), 0);
    igb.innerHTML =
      '<div class="tiles" id="igTiles"></div>' +
      '<div class="grid g2" style="margin-top:14px">' +
        '<div class="card"><h3>계정별 팔로워</h3><div id="igFollowers"></div></div>' +
        '<div class="card"><h3>계정별 게시물 수</h3><div id="igMedia"></div></div>' +
      '</div>' +
      '<div class="card" style="margin-top:14px"><h3>계정 현황</h3>' +
        '<div style="overflow-x:auto"><table id="igTable"></table></div>' +
        '<p class="note">' + esc(D.igApi.note) + '</p></div>' +
      '<div class="card" style="margin-top:14px">' +
        '<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px">' +
          '<h3 style="margin:0">최근 게시물</h3><div id="igTabs" class="legend" style="margin:0"></div></div>' +
        '<div style="overflow-x:auto"><table id="igMediaTable"></table></div>' +
        '<p class="note">최근 게시물 25건 기준입니다. 좋아요·댓글은 게시물 단위 공개 수치이며, 도달·노출·저장은 인사이트 권한이 있어야 조회됩니다.</p></div>' +
      '<div class="card" style="margin-top:14px"><p class="sub"><b>Threads</b> — ' + esc(D.meta.threads.reason) + '</p></div>';

    document.getElementById('igTiles').innerHTML =
      tile('총 팔로워', nf(totF), iga.length + '개 계정 합계') +
      tile('총 게시물', nf(totM), '누적') +
      tile('최근 참여', nf(totE), '최근 게시물 좋아요 + 댓글') +
      tile('연동 계정', iga.length + '개', 'Facebook 페이지 경유');

    const igSorted = iga.slice().sort((a, b) => b.ig.followers - a.ig.followers);
    hbars(document.getElementById('igFollowers'), igSorted.map((a, i) => ({
      label: a.label + ' · @' + a.ig.username.replace('beautyblossom_', ''),
      value: a.ig.followers, color: cssv(SERIES[i % 6]),
      extra: { k: '게시물', v: nf(a.ig.media_count) }
    })), { metric: '팔로워', padL: 150 });
    hbars(document.getElementById('igMedia'), igSorted.map((a, i) => ({
      label: a.label + ' · @' + a.ig.username.replace('beautyblossom_', ''),
      value: a.ig.media_count, color: cssv(SERIES[i % 6]),
      extra: { k: '팔로워', v: nf(a.ig.followers) }
    })), { metric: '게시물', padL: 150 });

    document.getElementById('igTable').innerHTML =
      '<thead><tr><th>계정</th><th>팔로워</th><th>팔로잉</th><th>게시물</th><th>최근 좋아요</th><th>최근 댓글</th><th>게시물당 참여</th></tr></thead><tbody>' +
      igSorted.map((a, i) => {
        const r = a.recent || { likes: 0, comments: 0, avgEngagement: 0 };
        return '<tr><td><span class="dot" style="background:' + cssv(SERIES[i % 6]) + '"></span> ' +
          esc(a.label) + ' · @' + esc(a.ig.username) + '</td>' +
          '<td>' + nf(a.ig.followers) + '</td><td>' + nf(a.ig.follows) + '</td><td>' + nf(a.ig.media_count) + '</td>' +
          '<td>' + nf(r.likes) + '</td><td>' + nf(r.comments) + '</td><td>' + nf1(r.avgEngagement) + '</td></tr>';
      }).join('') +
      '<tr style="font-weight:650"><td>합계</td><td>' + nf(totF) + '</td><td>—</td><td>' + nf(totM) + '</td>' +
      '<td>' + nf(iga.reduce((s, a) => s + ((a.recent && a.recent.likes) || 0), 0)) + '</td>' +
      '<td>' + nf(iga.reduce((s, a) => s + ((a.recent && a.recent.comments) || 0), 0)) + '</td><td>—</td></tr></tbody>';

    let igActive = igSorted[0].ig.username;
    function igTabs() {
      document.getElementById('igTabs').innerHTML = igSorted.map(a =>
        '<span><button type="button" class="theme" data-u="' + esc(a.ig.username) + '" style="' +
        (a.ig.username === igActive ? 'border-color:' + cssv('--s1') + ';color:' + cssv('--ink') + ';font-weight:600' : '') +
        '">' + esc(a.label) + '</button></span>').join('');
      Array.prototype.forEach.call(document.querySelectorAll('#igTabs button'), b => {
        b.onclick = () => { igActive = b.getAttribute('data-u'); igTabs(); igMediaDraw(); };
      });
    }
    function igMediaDraw() {
      const a = igSorted.filter(x => x.ig.username === igActive)[0];
      const md = (a && a.media) || [];
      document.getElementById('igMediaTable').innerHTML = md.length
        ? '<thead><tr><th>게시일</th><th>유형</th><th>내용</th><th>좋아요</th><th>댓글</th></tr></thead><tbody>' +
          md.slice(0, 15).map(m => '<tr><td>' + esc(String(m.timestamp || '').slice(0, 10)) + '</td>' +
            '<td>' + esc(m.product || m.type || '') + '</td>' +
            '<td><a href="' + esc(m.permalink) + '" target="_blank" rel="noopener">' +
            esc(m.caption || '(설명 없음)') + '</a></td>' +
            '<td>' + nf(m.likes) + '</td><td>' + nf(m.comments) + '</td></tr>').join('') + '</tbody>'
        : '<tbody><tr><td>게시물 데이터가 없습니다.</td></tr></tbody>';
    }
    igTabs(); igMediaDraw();
  } else {
    igb.innerHTML = '<div class="card" style="margin-top:14px">' +
      '<p class="sub"><b>Instagram</b> — ' + esc(D.meta.instagram.reason) + '</p>' +
      '<p class="sub" style="margin-top:16px"><b>Threads</b> — ' + esc(D.meta.threads.reason) + '</p></div>';
  }

  document.getElementById('statusTable').innerHTML =
    '<thead><tr><th>소스</th><th>범위</th><th>수집 방식</th><th>상태</th></tr></thead><tbody>' +
    '<tr><td>GA4</td><td>' + g.properties.length + '개 속성 · ' + g.range.days + '일</td><td>Analytics Data API</td><td class="up">완료</td></tr>' +
    '<tr><td>YouTube</td><td>1개 채널 · ' + y.range.days + '일</td><td>Data API v3 + Analytics API v2</td><td class="up">완료</td></tr>' +
    '<tr><td>Google Search Console</td><td>' + gscOk.length + '개 속성 · ' + ((D.gsc && D.gsc.range) ? D.gsc.range.days : 0) + '일</td>' +
    '<td>Search Analytics API</td><td class="' + (gscOk.length ? 'up' : 'dn') + '">' + (gscOk.length ? '완료' : '미수집') + '</td></tr>' +
    '<tr><td>네이버 서치어드바이저</td><td>' + ((nv && nv.sites) || []).length + '개 사이트 · 최근 30일</td><td>로그인 콘솔 UI 수집</td>' +
    '<td class="' + (okSites.length ? 'up' : 'dn') + '">' + (okSites.length ? '완료 (' + okSites.length + ')' : '미수집') + '</td></tr>' +
    '<tr><td>Instagram</td><td>' + igOk + '개 계정</td><td>Meta Graph API (instagram_basic)</td>' +
    '<td class="' + (igOk ? 'up' : 'dn') + '">' + (igOk ? '완료 — 인사이트 권한 대기' : '미수집') + '</td></tr>' +
    '<tr><td>Threads</td><td>' + D.meta.threads.accounts.length + '개 계정</td><td>Threads API (미추가)</td><td class="dn">다음 기간</td></tr></tbody>';
}
render();
addEventListener('resize', hideTip);
</script>
</body>
</html>
